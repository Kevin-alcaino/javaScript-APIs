<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Conversor de monedas</title>
</head>
<body>
    <header>
    <h1>Conversor de monedas.</h1>
    </header>
    <div class="contenedor">
    <div class="pesos">
    <h2>Pesos CLP</h2>
    <input id="monto" type="text" value="Ingrese monto.">
    </div>
    <div id="convertidor">
    <h2>Moneda a convertir</h2>
    <select id="select-moneda">
        <option value="">Selecione moneda</option>
    </select>
    </div>
    <div class="boton" >
        <button id="boton">Convertir</button>
    </div>
    <div id="resultado"></div>
    </div>

    <div class="contenedor-grafico">
        <canvas id="grafico"></canvas>
    </div>
    
</body>
<script src="assets/javScript/script.js"></script>
</html>
