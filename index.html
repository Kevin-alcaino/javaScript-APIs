<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Geist+Pixel&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <title>Conversor de monedas</title>
</head>
<body>
    <header>
    <h1>Conversor de monedas.</h1>
    </header>
    <div class="contenedor">
    <div class="pesos">
    <h2>Pesos Chileno (CLP)</h2>
    <input type="text" id="monto" placeholder="Ingrese monto.">
    </div>
    <div id="convertidor">
    <h2>Moneda a convertir</h2>
    <select id="select-moneda">
        <option value="">Selecione moneda</option>
    </select>
    </div>
    <div class="boton" >
        <button id="boton">Convertir</button>
    </div>
    <div id="resultado"></div>
    <div class="contenedor-grafico">
        <canvas id="grafico"></canvas>
    </div>
    </div>

    
</body>
<script src="assets/javScript/srcipt.js"></script>
</html>
